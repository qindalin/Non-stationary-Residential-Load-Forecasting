client:
  client_id: pi-client-001
  server_url: http://127.0.0.1:8000
  csv_path: sample_data/pi_client_001.csv
  state_dir: state/pi-client-001
  target_col: load
  feature_columns:
    - load
    - temperature
    - humidity
  seq_len: 8
  pred_len: 4
  moving_avg: 25
  train_ratio: 0.70
  batch_size: 32
  train_epochs: 5
  lr: 0.0005
  online_lr: 0.001
  unsynced_global_lr_scale: 1.0
  model_buffer_size: 7
  decay_rate: 0.1
  update_stride: 4
  snapshot_blend: 1.0
  timeout_seconds: 10.0
  device: cpu

strategy:
  sync_threshold: 0.05
  downlink_drift_threshold: 0.05
  downlink_utility_threshold: 0.01
  beta_resource: 1.0
  age_horizon: 12
  recent_window: 6
  resource_window: 12
  eta_min_scale: 0.5
  eta_max_scale: 2.0
  eta_slope: 2.0
  eta_bias: 0.5
  mu_max: 0.05
  mu_cloud_gain: 4.0
  mu_drift_penalty: 2.5
  drift_weight_loss: 0.40
  drift_weight_disagreement: 0.30
  drift_weight_volatility: 0.20
  drift_weight_age: 0.10
  epsilon: 1.0e-6